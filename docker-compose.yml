services:
  postgres:
    image: postgres:16
    container_name: academia-postgres
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    container_name: academia-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academia
      SPRING_DATASOURCE_USERNAME: academia
      SPRING_DATASOURCE_PASSWORD: academia
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
